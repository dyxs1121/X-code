
workflows:
  ios-trollstore-unsigned:
    name: X-Card iOS 无签名 IPA (TrollStore)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: 1/4 获取 Flutter 依赖
        script: flutter pub get

      - name: 2/4 生成 iOS 工程并彻底关闭代码签名（TrollStore 必需）
        script: |
          set -e
          if [ ! -d "ios" ]; then
            echo "未检测到 ios/ 目录，正在生成..."
            cp pubspec.yaml /tmp/xcard_pubspec.yaml
            cp -R lib /tmp/xcard_lib
            if [ -d assets ]; then cp -R assets /tmp/xcard_assets; fi
            flutter create --platforms ios --project-name x_card --org com.xcard .
            cp /tmp/xcard_pubspec.yaml pubspec.yaml
            rm -rf lib && cp -R /tmp/xcard_lib lib
            if [ -d /tmp/xcard_assets ]; then rm -rf assets && cp -R /tmp/xcard_assets assets; fi
          else
            echo "检测到 ios/ 目录，跳过生成。"
          fi

          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string X-Card" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName X-Card" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string X-Card" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleName X-Card" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 用于从相册选择并上传你的银行卡卡面照片" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 用于保存卡面图片" ios/Runner/Info.plist 2>/dev/null || true

          # ===== 关键：三层关闭签名，解决 "requires a Development Team" =====
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Podfile：追加 post_install，关闭所有 Pods target 签名（含资源 bundle）
          pod = Path('ios/Podfile')
          s = pod.read_text()
          if 'XCARD_NO_SIGN' not in s:
              s += '''

          # XCARD_NO_SIGN - fakesign will be handled by TrollStore
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGNING_IDENTITY'] = '-'
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = '-'
                config.build_settings['DEVELOPMENT_TEAM'] = ''
              end
            end
          end
          '''
              pod.write_text(s)

          # 2) project.pbxproj：所有 buildSettings 块强制无签名
          proj = Path('ios/Runner.xcodeproj/project.pbxproj')
          s = proj.read_text()
          keys = [
              'CODE_SIGNING_ALLOWED', 'CODE_SIGNING_REQUIRED', 'CODE_SIGN_STYLE',
              'DEVELOPMENT_TEAM', 'PROVISIONING_PROFILE_SPECIFIER', 'CODE_SIGN_IDENTITY',
          ]
          block = '''
                  CODE_SIGNING_ALLOWED = NO;
                  CODE_SIGNING_REQUIRED = NO;
                  CODE_SIGN_STYLE = Manual;
                  DEVELOPMENT_TEAM = "";
                  PROVISIONING_PROFILE_SPECIFIER = "";
                  CODE_SIGN_IDENTITY = "";
          '''

          def fix(match):
              body = match.group(1)
              for key in keys:
                  body = re.sub(r'\s*' + key + r'\s*=\s*[^;]*;', '', body)
              return 'buildSettings = {' + block + body + '};'

          s = re.sub(r'buildSettings = \{(.*?)\};', fix, s, flags=re.S)
          proj.write_text(s)

          # 3) xcconfig 兜底
          for name in ('Debug', 'Profile', 'Release'):
              f = Path('ios/Flutter') / (name + '.xcconfig')
              if f.exists():
                  text = f.read_text()
                  if 'CODE_SIGNING_ALLOWED' not in text:
                      text += ('\nCODE_SIGNING_ALLOWED = NO\n'
                               'CODE_SIGNING_REQUIRED = NO\n'
                               'CODE_SIGN_STYLE = Manual\n'
                               'DEVELOPMENT_TEAM = ""\n'
                               'PROVISIONING_PROFILE_SPECIFIER = ""\n')
                      f.write_text(text)
          print('已关闭 Pods / Runner / xcconfig 的全部代码签名')
          PY

          echo "Bundle ID: com.xcard.x_card"

      - name: 3/4 构建无签名 iOS App
        script: |
          set -e
          # 环境变量再兜一层，避免 Xcode 读取到任何签名要求
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export EXPANDED_CODE_SIGN_IDENTITY=""

          if flutter build ios --release --no-codesign; then
            echo "Flutter 构建成功"
          else
            echo "flutter build ios 失败，尝试直接 xcodebuild（显式关闭签名）..."
            flutter build ios --config-only --release --no-codesign
            xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/ios/iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              build
          fi

      - name: 4/4 打包为 IPA
        script: |
          set -e
          rm -rf Payload output
          mkdir -p Payload output
          APP=$(find build/ios -type d -name Runner.app -print -quit)
          if [ -z "$APP" ]; then
            echo "找不到 Runner.app，构建目录内容如下："
            find build/ios -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "使用 App 包: $APP"
          cp -R "$APP" Payload/X-Card.app
          zip -qr X-Card.ipa Payload
          cp X-Card.ipa output/X-Card.ipa
          ls -lh output/X-Card.ipa

    artifacts:
      - output/*.ipa
      - build/ios/iphoneos/*.app
